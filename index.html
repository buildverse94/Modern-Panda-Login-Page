<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="nav">
        <a class="logo" href="#">PandaS<span>.</span> </a>
        <nav>
          <a href="#">HOME</a>
          <a href="#">GALLERY</a>
          <a href="#">PROJECT</a>
        </nav>
      </header>

      <section class="content">
        <form class="form" id="loginForm" novalidate>
          <h1>WELCOME BACK!</h1>
          <p class="signup">
            Dont't have a account,
            <a href="#">Sign up</a>
          </p>

          <label for="username">Username</label>

          <input type="email" id="username" placeholder="example@gmail.com"
          autocomplete="username">

          <label for="password">Password</label>

          <div class="pass-wrap">
            <input class="password" id="password" type="password" placeholder="••••••"
            autocomplete="current-password">

            <button type="button" id="toggle" aria-label="Show password">
                <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                >
                <path 
                id="eyeOpen"
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                />
                <circle cx="12" cy="12" r="3" />
                <line id="eyeSlash" x1="3" y1="3" x2="21" y2="21" />

            </svg>
            </button>
          </div>

          <p class="error" id="error" role="alert"></p>

          <div class="row">
            <label class="remember">
                <input type="checkbox" id="remember">
                <span class="dot"></span>
                Remember me
            </label>

            <a href="#" class="forgot">Forgot password?</a>
          </div>

          <button type="submit" class="signin">Sign In</button>
        </form>

        <aside class="art">
            <div class="circle">
                <img
                src="panda.png" alt="Panda mascot"

                onerror="this.replaceWith(Object.assign(document.createElement('span'), {
                    textContent:'🐼', className:'fallback' }))">
            </div>
            <ul class="social">
                <li>
                    <a href="#" aria-label="Twitter">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                </li>

                <li>
                    <a href="#" aria-label="Discord">
                        <i class="fa-brands fa-discord"></i>
                    </a>
                </li>

                <li>
                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </li>

                <li>
                    <a href="#" aria-label="facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                </li>

                <li>
                    <a href="#" aria-label="Behance">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </li>
            </ul>
        </aside>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
